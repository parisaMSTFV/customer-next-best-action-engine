name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test
        run: python -m pytest
      - name: Check public files
        run: python scripts/check_sensitive.py
      - name: Smoke test
        run: >-
          python -m next_best_action --project-root . --customers 500 --seed 7
          --output-dir artifacts/ci-smoke
      - name: Versioned-input integration test
        run: >-
          python -m next_best_action --project-root .
          --input-dir data/fixtures/upstream-v1
          --output-dir artifacts/external-fixture
      - name: Verify clean tracked tree
        run: git diff --exit-code
